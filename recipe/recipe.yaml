# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.0"
  python_check_max: "3.15"

recipe:
  name: cross-web-split
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cross-web/cross_web-${{ version }}.tar.gz
  sha256: c6be38ebcf62454e7dd53012b47950c853175b8388d29e0e88c941669b4d57a5

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: cross-web
    build:
      script:
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
    requirements:
      host:
        - hatchling
        - pip
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - typing_extensions >=4.14.0
      run_constraints:
        # [integrations]
        - aiohttp >=3.9
        - chalice >=1.29
        - django >=4.2
        - fastapi >=0.115.12
        - flask >=2.3
        - httpx >=0.28.1
        - litestar >=2.0
        - python-multipart >=0.0.20
        - quart >=0.19
        - sanic >=23.0
        - sanic-testing >=23.0
        - starlette >=0.46.1
        - werkzeug >=2.3
        - yarl >=1.9
    tests:
      - package_contents:
          strict: true
          site_packages:
            - cross_web/**
            - cross_web-${{ version }}.dist-info/**
      - python:
          imports: cross_web
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*

  - package:
      name: cross-web-with-integrations
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("cross-web", exact=True) }}
        - aiohttp
        # - chalice
        - django
        - fastapi
        - flask
        - httpx
        - litestar
        - python-multipart
        - quart
        - sanic
        - sanic-testing
        - starlette
        - werkzeug
        - yarl
    tests:
      - python:
          imports: cross_web
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - pyproject.toml
            - tests/
        requirements:
          run:
            - inline-snapshot >=0.20.10
            - pytest >=7.4.4
            - pytest-asyncio >=0.23.8
            - pytest-cov >=6.0.0
            - pytest-django >=4.11.0
            - python ${{ python_min }}.*
        script:
          content:
            # avoid source path confusion in pyproject.toml
            - python -c "import pathlib; pathlib.Path('.coveragerc').write_text('[run]\nbranch = true\npatch = subprocess')"
            - coverage run --source=cross_web -m pytest --tb=long --color=yes -vv --tb=long --color=yes -k "not (chalice or quart)" -o asyncio_default_fixture_loop_scope=function
            - coverage report --show-missing --skip-covered --fail-under=85
    about:
      summary: A library for working with web frameworks (with [integrations])

about:
  summary: A library for working with web frameworks
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/cross-web
  repository: https://github.com/usecross/cross-web

extra:
  feedstock-name: cross-web
  recipe-maintainers:
    - bollwyvl
